[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-memory"
version = "0.1.0"
description = "Pressure-Driven Memory (PDM) — persistent, resonance-based memory for AI apps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Westfield Innovations LLC" }]
keywords = ["ai", "memory", "llm", "rag", "pressure-driven", "persistent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0", "tiktoken>=0.7"]
anthropic = ["anthropic>=0.25"]
all = ["openai>=1.0", "tiktoken>=0.7", "anthropic>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",       # httpx mock
    "openai>=1.0",
    "anthropic>=0.25",
    "tiktoken>=0.7",
    "ruff>=0.4",
]

[project.scripts]
pdm-cli = "pdm_memory.tools.cli:main"

[project.urls]
Homepage = "https://github.com/westfield-innovations/pdm-memory"
"Bug Tracker" = "https://github.com/westfield-innovations/pdm-memory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdm_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
