name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, "feat/**"]
  release:
    types: [published]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # A PR merge commit was already tested as refs/pull/N/merge; direct pushes still run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Everything Postgres-shaped in this package — the plpgsql trigger bodies,
    # ON CONFLICT without a conflict target, psycopg's rowcount, the quoting of
    # the reserved word "user" — was previously asserted as strings against a
    # recorder. That proves the SQL was composed, not that a server accepts it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PDM_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/pdm_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint, format and types of the ledgers
        run: |
          ruff check pdm_memory/_sqldb.py pdm_memory/_chain.py pdm_memory/_errors.py pdm_memory/consequence pdm_memory/goal_loop tests/test_sqldb.py tests/test_ledger_races.py tests/ledger_target.py tests/consequence_fixtures.py tests/test_consequence_*.py
          ruff format --check pdm_memory/_sqldb.py pdm_memory/_chain.py pdm_memory/_errors.py pdm_memory/consequence tests/test_sqldb.py tests/test_ledger_races.py tests/ledger_target.py tests/consequence_fixtures.py tests/test_consequence_*.py
          mypy

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=pdm_memory --cov-report=term-missing

      - name: Ledgers on Postgres
        env:
          PDM_TEST_LEDGER_BACKEND: postgres
        run: >-
          pytest tests/test_sqldb.py tests/test_goal_loop_store.py tests/test_guarded_effects.py
          tests/test_consequence_*.py tests/test_ledger_races.py -q

      - name: Smoke-test benchmark
        run: python -m pdm_memory.bench --quick

      - name: Smoke-test CLI
        run: |
          pdm-cli --help
          # --user is required by every command that opens a store.
          pdm-cli --user ci stats --store /tmp/ci_test.db
          # And refused, loudly, when it is missing — the point of requiring it.
          if pdm-cli stats --store /tmp/ci_test.db 2>/dev/null; then
            echo "CLI opened a store without --user" >&2
            exit 1
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  openclaw-plugin:
    name: OpenClaw plugin (Node 24)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    steps:
      - uses: actions/checkout@v4

      # The plugin's hooks call pdm_memory through a python3 subprocess.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pdm-memory
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run plugin tests
        run: node --experimental-strip-types --test plugins/tests/openclaw/*.test.mjs

  publish:
    name: Publish to PyPI
    needs: [test, openclaw-plugin]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/project/pdm-memory/

    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read   # Required to checkout the repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match pyproject version '$PKG'. Retag the commit that bumps the version."
            exit 1
          fi

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC — no API token needed when trusted publishing is configured
        # Set up at: https://pypi.org/manage/project/pdm-memory/settings/publishing/
