name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Everything Postgres-shaped in this package — the plpgsql trigger bodies,
    # ON CONFLICT without a conflict target, psycopg's rowcount, the quoting of
    # the reserved word "user" — was previously asserted as strings against a
    # recorder. That proves the SQL was composed, not that a server accepts it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PDM_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/pdm_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=pdm_memory --cov-report=term-missing

      - name: Smoke-test benchmark
        run: python -m pdm_memory.bench --quick

      - name: Smoke-test CLI
        run: |
          pdm-cli --help
          pdm-cli stats --store /tmp/ci_test.db

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  publish:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/project/pdm-memory/

    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read   # Required to checkout the repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match pyproject version '$PKG'. Retag the commit that bumps the version."
            exit 1
          fi

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC — no API token needed when trusted publishing is configured
        # Set up at: https://pypi.org/manage/project/pdm-memory/settings/publishing/
